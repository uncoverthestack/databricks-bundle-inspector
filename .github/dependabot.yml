version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Hijacked versions are usually found and pulled within days, so new versions wait a
    # week before Dependabot offers them (#492). GitHub's default is 3 days. Security
    # updates never wait.
    cooldown:
      default-days: 7
    groups:
      # @eslint/js must match the major version of eslint, so they move together.
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must stay at or below engines.vscode, or `vsce package` refuses to build.
      - dependency-name: "@types/vscode"
      # ts-jest does not support TypeScript 7 yet (its peer range is below 7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Type definitions should match the Node version the code runs on, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Python grammar (tree-sitter-python, #691) is built for one tree-sitter version
      # (0.25 for grammar 0.25.0). A 0.x minor release of web-tree-sitter is a breaking one:
      # 0.27 renamed its files and broke the build (#684). So those move by hand, in the same
      # PR as a grammar update. Patch releases (0.25.x) still come.
      - dependency-name: "web-tree-sitter"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Hijacked versions are usually found and pulled within days, so new versions wait a
    # week before Dependabot offers them (#492). GitHub's default is 3 days. Security
    # updates never wait.
    cooldown:
      default-days: 7
    groups:
      # The release workflow uploads in one job and downloads in another, so the
      # two must always move to new versions together, including major ones.
      artifact-actions:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact
      actions-minor-and-patch:
        update-types: [minor, patch]
