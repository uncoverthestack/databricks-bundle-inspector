version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Hijacked versions are usually found and pulled within days, so new versions wait a
    # week before Dependabot offers them (#492). GitHub's default is 3 days. Security
    # updates never wait.
    cooldown:
      default-days: 7
    groups:
      # @eslint/js must match the major version of eslint, so they move together.
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must stay at or below engines.vscode, or `vsce package` refuses to build.
      - dependency-name: "@types/vscode"
      # ts-jest does not support TypeScript 7 yet (its peer range is below 7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Type definitions should match the Node version the code runs on, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Python grammar comes built from @vscode/tree-sitter-wasm, for the web-tree-sitter
      # version its own build uses (0.25.10 for 0.3.1). So web-tree-sitter moves by hand, in
      # the same PR as a @vscode/tree-sitter-wasm update, to the version that release uses.
      # On its own, 0.27 renamed its files and broke the build (#684).
      - dependency-name: "web-tree-sitter"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Hijacked versions are usually found and pulled within days, so new versions wait a
    # week before Dependabot offers them (#492). GitHub's default is 3 days. Security
    # updates never wait.
    cooldown:
      default-days: 7
    groups:
      # The release workflow uploads in one job and downloads in another, so the
      # two must always move to new versions together, including major ones.
      artifact-actions:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact
      actions-minor-and-patch:
        update-types: [minor, patch]
