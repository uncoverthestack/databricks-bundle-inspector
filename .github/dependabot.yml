version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # @eslint/js must match the major version of eslint, so they move together.
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must stay at or below engines.vscode, or `vsce package` refuses to build.
      - dependency-name: "@types/vscode"
      # ts-jest does not support TypeScript 7 yet (its peer range is below 7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Type definitions should match the Node version the code runs on, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The release workflow uploads in one job and downloads in another, so the
      # two must always move to new versions together, including major ones.
      artifact-actions:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact
      actions-minor-and-patch:
        update-types: [minor, patch]
