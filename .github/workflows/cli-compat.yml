name: Databricks CLI compatibility

# Runs the inspector against real Databricks CLI releases: the semantic fixtures
# (graph, labels and diagnostics with file locations) and the bundle schema
# coverage check. The weekly run catches a new CLI release changing its output
# or adding task/resource types, without waiting for a code change.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
  # The merge queue tests each pull request merged with main and the ones queued ahead of
  # it; required checks must run here too, or the queue waits for them until it times out.
  merge_group:
    types: [checks_requested]

# A newer push to a pull request cancels its older run, whose result no one reads.
# Every other event (main, schedules, releases) gets a group of its own: never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compat:
    name: CLI ${{ matrix.cli }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "latest" is resolved at run time. 0.299.x is the oldest supported line.
        cli: ["latest", "0.299.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Repair native optional bindings
        run: npm run deps:repair-native

      - name: Install Databricks CLI
        env:
          CLI_VERSION: ${{ matrix.cli }}
        run: |
          set -euo pipefail
          if [ "$CLI_VERSION" = "latest" ]; then
            # Follow the web redirect: the GitHub API is blocked for the databricks org
            # by an IP allow list, but release pages and downloads are public.
            latest_url="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/databricks/cli/releases/latest)"
            CLI_VERSION="${latest_url##*/v}"
          fi
          echo "Installing Databricks CLI ${CLI_VERSION}"
          archive="databricks_cli_${CLI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/databricks/cli/releases/download/v${CLI_VERSION}"
          workdir="$RUNNER_TEMP/databricks-cli"
          mkdir -p "$workdir"
          cd "$workdir"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/databricks_cli_${CLI_VERSION}_SHA256SUMS"
          grep " ${archive}\$" "databricks_cli_${CLI_VERSION}_SHA256SUMS" | sha256sum --check -
          tar -xzf "$archive" databricks
          echo "$workdir" >> "$GITHUB_PATH"

      - name: Show CLI version
        run: databricks --version

      - name: Semantic fixtures
        run: npm run test:semantic:cli:matrix

      # Against a fake workspace on 127.0.0.1: no login, and no real workspace is contacted.
      - name: Variables, values the CLI deploys
        run: npm run test:variables:cli

      - name: Bundle schema coverage
        run: npm run test:schema-coverage

      # The random task-graph test with 20,000 jobs instead of the 400 every push runs
      # (about 2 minutes). It doesn't use the CLI, so once per run, not per CLI version.
      # Weekly and by hand only, not for each pull request in the merge queue.
      - name: Random task graphs, 20,000 jobs
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.cli == 'latest'
        env:
          RANDOM_RUNS: "20000"
        run: npx jest src/test/unit/extension/jobStructure.random.test.ts
