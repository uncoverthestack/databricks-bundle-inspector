name: E2E

# The VS Code end-to-end suites on Windows, Linux and macOS, with a real Databricks CLI.
# The trust benchmark: the merge queue runs it on each pull request merged with main, and a
# release only publishes when it passes on all three (release.yml calls it). Not on the push
# to main, which is the commit the queue just tested (#296). To run it on a branch before
# queueing, use Run workflow. Each OS runs its suites in two groups at once (#314).
on:
  # On a pull request the groups are skipped and only the e2e summary jobs run, so the
  # pull request can join the queue.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The merge queue tests each pull request merged with main and the ones queued ahead of
  # it; required checks must run here too, or the queue waits for them until it times out.
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to test (the release's)."
        required: false
        type: string

# A newer push to a pull request cancels its older run, whose result no one reads.
# Every other event (main, schedules, releases) gets a group of its own: never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two groups per OS, at the same time. The suites are split by measured time so both
  # groups take about as long (macOS, 2026-10-29: about 200 seconds each). Two, not three:
  # the org's GitHub Free plan runs 20 hosted jobs and 5 macOS jobs at once, org-wide.
  e2e-group:
    name: E2E (${{ matrix.name }} ${{ matrix.group }}/2)
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS or group failing must not hide the others' results.
      fail-fast: false
      matrix:
        name: [Windows, Linux, macOS]
        group: [1, 2]
        include:
          - name: Windows
            os: windows-latest
            cli: windows_amd64
            display: ""
          # The only one of the three whose file system tells letter case apart, and where
          # the extension runs for WSL, Remote-SSH and Codespaces users. No screen, so a
          # virtual display.
          - name: Linux
            os: ubuntu-latest
            cli: linux_amd64
            display: "xvfb-run -a"
          - name: macOS
            os: macos-latest
            cli: darwin_arm64
            display: ""

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Databricks CLI
        run: |
          set -euo pipefail
          # Follow the web redirect, as in cli-compat.yml: release pages are public.
          latest_url="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/databricks/cli/releases/latest)"
          CLI_VERSION="${latest_url##*/v}"
          echo "Installing Databricks CLI ${CLI_VERSION} (${{ matrix.cli }})"
          archive="databricks_cli_${CLI_VERSION}_${{ matrix.cli }}.tar.gz"
          base="https://github.com/databricks/cli/releases/download/v${CLI_VERSION}"
          workdir="$RUNNER_TEMP/databricks-cli"
          mkdir -p "$workdir"
          cd "$workdir"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/databricks_cli_${CLI_VERSION}_SHA256SUMS"
          if command -v sha256sum >/dev/null; then check=(sha256sum --check -); else check=(shasum -a 256 --check -); fi
          grep " ${archive}\$" "databricks_cli_${CLI_VERSION}_SHA256SUMS" | "${check[@]}"
          tar -xzf "$archive"
          if [ "$RUNNER_OS" = "Windows" ]; then cygpath -w "$workdir" >> "$GITHUB_PATH"; else echo "$workdir" >> "$GITHUB_PATH"; fi

      - name: Show CLI version
        run: databricks --version

      # Windows can't run the #!/bin/sh fakes the CLI-detection tests use elsewhere, so they
      # get real programs: the legacy pip package and a CLI older than v0.299.0. Only the
      # no-CLI suite uses them, in group 2.
      - name: Install the legacy pip databricks-cli (Windows)
        if: runner.os == 'Windows' && matrix.group == 2
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/legacy-cli"
          "$RUNNER_TEMP/legacy-cli/Scripts/python.exe" -m pip install --disable-pip-version-check --quiet "databricks-cli==0.18.0"
          exe="$(cygpath -w "$RUNNER_TEMP/legacy-cli/Scripts/databricks.exe")"
          "$exe" --version
          echo "E2E_LEGACY_CLI=$exe" >> "$GITHUB_ENV"

      - name: Install Databricks CLI v0.250.0, older than supported (Windows)
        if: runner.os == 'Windows' && matrix.group == 2
        run: |
          set -euo pipefail
          version=0.250.0
          archive="databricks_cli_${version}_windows_amd64.tar.gz"
          base="https://github.com/databricks/cli/releases/download/v${version}"
          workdir="$RUNNER_TEMP/old-databricks-cli"
          mkdir -p "$workdir"
          cd "$workdir"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/databricks_cli_${version}_SHA256SUMS"
          grep " ${archive}\$" "databricks_cli_${version}_SHA256SUMS" | sha256sum --check -
          tar -xzf "$archive"
          ./databricks.exe --version
          echo "E2E_OLD_CLI=$(cygpath -w "$workdir/databricks.exe")" >> "$GITHUB_ENV"

      # Built once: the npm run test:e2e:* scripts rebuild everything before each suite.
      - name: Build the extension, webview and tests
        run: npm run build:ext && npm run build:webview && npm run build:e2e

      # Each suite opens its own folder; one step each so a failure names its suite. The
      # arguments are those of its npm run test:e2e:* script (e2eWorkflow.test.ts checks).
      - name: E2E, no CLI on PATH
        if: matrix.group == 2
        run: ${{ matrix.display }} node out/e2e/runTest.cjs
      - name: E2E, include
        if: matrix.group == 2
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite includeMistakes --fixture src/test/fixtures/include-mistakes
      - name: E2E, issue codes
        if: matrix.group == 1
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite issueCodes --fixture src/test/e2e/fixtures/issue-codes
      - name: E2E, always-on
        if: matrix.group == 2
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite alwaysOn --fixture src/test/e2e/fixtures/always-on
      - name: E2E, saved file
        if: matrix.group == 1
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite savedFile --fixture src/test/e2e/fixtures/saved-file
      - name: E2E, saved file, folder opened in another letter case
        if: matrix.group == 2
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite savedFile --fixture src/test/e2e/fixtures/saved-file --folder-case other
      - name: E2E, resource files
        if: matrix.group == 2
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite resourceFiles --fixture src/test/e2e/fixtures/resource-files
      - name: E2E, rendered graph
        if: matrix.group == 1
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite graphRefresh --fixture src/test/e2e/fixtures/resource-files
      - name: E2E, theme colours
        if: matrix.group == 2
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite themes --fixture src/test/e2e/fixtures/themes
      # What was on screen in each theme, to see why a contrast or pixel check failed.
      - name: Upload theme screenshots
        if: failure() && matrix.group == 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: theme-screenshots-${{ runner.os }}
          path: |
            out/e2e/themes/
            out/e2e/themes-report.json
          if-no-files-found: ignore
      - name: E2E, overlapping inspections
        if: matrix.group == 1 && runner.os != 'Windows'
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite inspectionRaces --fixture src/test/e2e/fixtures/resource-files
      # The cases that need a workspace login are skipped: CI has none.
      - name: E2E, targets
        if: matrix.group == 1
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite targets --fixture src/test/e2e/fixtures/targets
      - name: E2E, sidebar
        if: matrix.group == 1
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite sidebar --fixture src/test/e2e/fixtures/targets
      - name: E2E, workspace changes (shared files, removed and new bundles)
        if: matrix.group == 2
        run: ${{ matrix.display }} node out/e2e/runTest.cjs --suite workspaceChanges --fixture src/test/e2e/fixtures/workspace-changes

  # The required checks, by the names the ruleset and merge queue wait for. In the merge
  # queue and at release they pass only when every group passed; needs gives one result
  # for all groups, so a failing group fails all three, and the group jobs say which. On a
  # pull request the groups are skipped and these pass at once: E2E runs in the queue. A
  # skipped matrix job is reported once, as "E2E (${{ matrix.name }})", so these can't be
  # skipped themselves (seen on #297).
  e2e:
    name: E2E (${{ matrix.name }})
    needs: e2e-group
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [Windows, Linux, macOS]
    steps:
      - name: Every group passed
        env:
          EVENT: ${{ github.event_name }}
          GROUPS: ${{ needs.e2e-group.result }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "E2E runs in the merge queue, or by hand with Run workflow."
            exit 0
          fi
          echo "E2E groups: $GROUPS"
          [ "$GROUPS" = "success" ]
