name: Publish existing release

# Publishes the VSIX and the command-line tool's npm packages already attached to a GitHub
# release, without rebuilding them, so every registry serves the same bytes. release.yml starts it for each new tag;
# run it by hand to backfill a registry added after a release, or to retry one.
# Versions a registry already has are skipped, so re-running is safe.
# The publishing tools come from the branch this runs on; only the VSIX and the npm
# packages come from the release. Releases before 0.10.0 have no npm packages.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.8"
        required: true
        type: string
      registry:
        description: "Where to publish: both = the two extension stores, all = both plus npm"
        required: true
        type: choice
        default: open-vsx
        options:
          - open-vsx
          - vscode-marketplace
          - both
          - npm
          - all

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-marketplace:
    name: Publish to VS Code Marketplace
    if: inputs.registry == 'vscode-marketplace' || inputs.registry == 'both' || inputs.registry == 'all'
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=UncoverTheStack.databricks-bundle-inspector
    permissions:
      contents: read
      # Trusted publishing: the Marketplace swaps this job's GitHub OIDC token for a 15-minute
      # publishing credential. The publisher's policy names this workflow and environment (#74).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # This job can get a publishing token, so no package's install script runs here (#492).
      # Publishing needs none: the only one vsce and ovsx use, vsce-sign's, sets up a signing
      # program that runs only with --sign-tool, --manifestPath or --sigzipPath.
      - name: Install dependencies without install scripts
        run: npm ci --include=optional --ignore-scripts

      - name: Download and verify release VSIX
        id: vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "*.vsix" --pattern "*.vsix.sha256"
          sha256sum --check ./*.vsix.sha256
          echo "package_name=$(ls ./*.vsix)" >> "$GITHUB_OUTPUT"

      # No VSCE_PAT here: vsce reads it as --pat, and --oidc with a token stops with an error.
      - name: Publish VSIX
        env:
          PACKAGE: ${{ steps.vsix.outputs.package_name }}
        run: npx vsce publish --packagePath "$PACKAGE" --skip-duplicate --oidc

  publish-open-vsx:
    name: Publish to Open VSX
    if: inputs.registry == 'open-vsx' || inputs.registry == 'both' || inputs.registry == 'all'
    runs-on: ubuntu-latest
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/UncoverTheStack/databricks-bundle-inspector
    permissions:
      contents: read
      # Trusted publishing: Open VSX swaps this job's GitHub OIDC token for a short-lived
      # publishing token. Registered for this workflow and the open-vsx environment (#175).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # This job can get a publishing token, so no package's install script runs here (#492).
      # Publishing needs none: the only one vsce and ovsx use, vsce-sign's, sets up a signing
      # program that runs only with --sign-tool, --manifestPath or --sigzipPath.
      - name: Install dependencies without install scripts
        run: npm ci --include=optional --ignore-scripts

      - name: Download and verify release VSIX
        id: vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "*.vsix" --pattern "*.vsix.sha256"
          sha256sum --check ./*.vsix.sha256
          echo "package_name=$(ls ./*.vsix)" >> "$GITHUB_OUTPUT"

      # No OVSX_PAT here: a token in the environment would be used instead of the OIDC exchange.
      - name: Publish VSIX
        env:
          PACKAGE: ${{ steps.vsix.outputs.package_name }}
        run: npx ovsx publish "$PACKAGE" --skip-duplicate --trusted-publishing

  # The command-line tool (#348) under both of its npm names. This job only stages them: nothing
  # is public until a maintainer approves each staged version on npm with two-factor
  # authentication (npmjs.com > Staged Packages). A workflow run alone can't publish.
  publish-npm:
    name: Stage on npm
    if: inputs.registry == 'npm' || inputs.registry == 'all'
    runs-on: ubuntu-latest
    environment:
      name: npm-registry
      url: https://www.npmjs.com/package/@uncoverthestack/databricks-bundle-inspector
    permissions:
      contents: read
      # Trusted publishing: npm swaps this job's GitHub OIDC token for a short-lived token. Each
      # package trusts this workflow and the npm-registry environment for staging only, so no npm token
      # is stored anywhere and the token can't publish directly.
      id-token: write

    steps:
      # Only for .nvmrc. Nothing is installed: publishing a packed file needs npm alone.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"

      - name: Check npm supports staged publishing
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error("Staged publishing needs npm 11.15.0 or newer");
              process.exit(1);
            }' "$version"

      - name: Download and verify the release's npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/npm-packages" && cd "$RUNNER_TEMP/npm-packages"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.tgz" --pattern "*.tgz.sha256"
          sha256sum --check ./*.tgz.sha256
          test "$(ls ./*.tgz | wc -l)" -eq 2

      # A version npm already has is skipped, so a re-run stages only what is missing; a version
      # staged but not yet approved can't be seen from here, and staging it again fails. A
      # pre-release goes to the next tag, so a plain install never picks it up.
      - name: Stage
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npm-packages"
          for package in ./*.tgz; do
            manifest="$(tar -xOzf "$package" package/package.json)"
            name="$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")"
            version="$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")"
            if [ "v$version" != "$TAG" ]; then
              echo "$package is version $version, not ${TAG#v}" >&2
              exit 1
            fi
            if found="$(npm view "$name@$version" version 2> view-error.txt)"; then
              if [ "$found" = "$version" ]; then
                echo "$name@$version is already on npm, skipped"
                continue
              fi
            elif ! grep -q E404 view-error.txt; then
              cat view-error.txt >&2
              exit 1
            fi
            dist_tag=latest
            case "$version" in *-*) dist_tag=next ;; esac
            npm stage publish "$package" --access public --tag "$dist_tag" --ignore-scripts
            echo "Staged $name@$version ($dist_tag): approve it on npmjs.com under Staged Packages"
            echo "- Staged \`$name@$version\` (\`$dist_tag\`): approve it on npmjs.com under Staged Packages" >> "$GITHUB_STEP_SUMMARY"
          done
