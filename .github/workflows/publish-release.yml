name: Publish existing release

# Publishes the VSIX already attached to a GitHub release, without rebuilding it,
# so every registry serves the same bytes. release.yml starts it for each new tag;
# run it by hand to backfill a registry added after a release, or to retry one.
# Versions a registry already has are skipped, so re-running is safe.
# The publishing tools come from the branch this runs on; only the VSIX comes
# from the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.8"
        required: true
        type: string
      registry:
        description: "Where to publish"
        required: true
        type: choice
        default: open-vsx
        options:
          - open-vsx
          - vscode-marketplace
          - both

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-marketplace:
    name: Publish to VS Code Marketplace
    if: inputs.registry == 'vscode-marketplace' || inputs.registry == 'both'
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=UncoverTheStack.databricks-bundle-inspector
    permissions:
      contents: read
      # Trusted publishing: the Marketplace swaps this job's GitHub OIDC token for a 15-minute
      # publishing credential. The publisher's policy names this workflow and environment (#74).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Download and verify release VSIX
        id: vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "*.vsix" --pattern "*.vsix.sha256"
          sha256sum --check ./*.vsix.sha256
          echo "package_name=$(ls ./*.vsix)" >> "$GITHUB_OUTPUT"

      # No VSCE_PAT here: vsce reads it as --pat, and --oidc with a token stops with an error.
      - name: Publish VSIX
        env:
          PACKAGE: ${{ steps.vsix.outputs.package_name }}
        run: npx vsce publish --packagePath "$PACKAGE" --skip-duplicate --oidc

  publish-open-vsx:
    name: Publish to Open VSX
    if: inputs.registry == 'open-vsx' || inputs.registry == 'both'
    runs-on: ubuntu-latest
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/UncoverTheStack/databricks-bundle-inspector
    permissions:
      contents: read
      # Trusted publishing: Open VSX swaps this job's GitHub OIDC token for a short-lived
      # publishing token. Registered for this workflow and the open-vsx environment (#175).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Download and verify release VSIX
        id: vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "*.vsix" --pattern "*.vsix.sha256"
          sha256sum --check ./*.vsix.sha256
          echo "package_name=$(ls ./*.vsix)" >> "$GITHUB_OUTPUT"

      # No OVSX_PAT here: a token in the environment would be used instead of the OIDC exchange.
      - name: Publish VSIX
        env:
          PACKAGE: ${{ steps.vsix.outputs.package_name }}
        run: npx ovsx publish "$PACKAGE" --skip-duplicate --trusted-publishing
