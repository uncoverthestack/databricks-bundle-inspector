name: Release

# Runs only for a pushed tag, so every release is built from its tag's commit. It creates the
# GitHub release, then starts publish-release.yml, which publishes the release's VSIX. To
# publish an existing release to a registry again, run publish-release.yml by hand.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The trust benchmark: nothing is packaged or published unless the end-to-end suites
  # pass on Windows, Linux and macOS for the exact commit being released.
  e2e:
    name: E2E on every OS
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.ref }}

  package:
    name: Package GitHub release
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Repair native optional bindings
        run: npm run deps:repair-native

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Check tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_name="${GITHUB_REF_NAME}"
          if [ "$tag_name" != "v$package_version" ]; then
            echo "Tag $tag_name does not match package.json version $package_version" >&2
            exit 1
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm run package:vsix
          package_name="$(ls databricks-bundle-inspector-*.vsix)"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${{ steps.package.outputs.package_name }}" > "${{ steps.package.outputs.package_name }}.sha256"
          cat "${{ steps.package.outputs.package_name }}.sha256"

      - name: Verify checksum
        run: sha256sum --check "${{ steps.package.outputs.package_name }}.sha256"

      # Only this version's section of CHANGELOG.md, not every version's (#294). Fails when
      # the version has no section or an empty one, before anything is created.
      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
        run: node scripts/changelog.mjs notes "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag_name }}" > /dev/null 2>&1; then
            echo "Release already exists — uploading assets only"
            gh release upload "${{ steps.version.outputs.tag_name }}" \
              "${{ steps.package.outputs.package_name }}" \
              "${{ steps.package.outputs.package_name }}.sha256" \
              --clobber
          else
            gh release create "${{ steps.version.outputs.tag_name }}" \
              "${{ steps.package.outputs.package_name }}" \
              "${{ steps.package.outputs.package_name }}.sha256" \
              --title "${{ steps.version.outputs.tag_name }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  # Publishing runs in its own publish-release.yml run, started here for this tag. Open VSX
  # trusts one workflow file per extension, and checks the file that started the run, not a
  # workflow it calls. Starting a separate run means a release and a later re-send both come
  # from publish-release.yml, so its one registration covers both (#175).
  publish:
    name: Start publishing
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Start publish-release.yml for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag_name }}
        run: gh workflow run publish-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG" -f registry=both
