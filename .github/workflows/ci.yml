name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          extra_args: --only-verified

  ci:
    name: Build, Test, Lint, Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Repair native optional bindings
        run: npm run deps:repair-native

      - name: Verify native bindings
        run: |
          node -e "require('@rolldown/binding-linux-x64-gnu')"
          node -e "require('@unrs/resolver-binding-linux-x64-gnu')"

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension
        run: npm run build:ext

      - name: Build webview
        run: npm run build:webview

      - name: Run tests (jest)
        run: npm run test:unit

      - name: Run semantic tests (jest)
        run: npm run test:semantic

      - name: Lint
        run: npm run lint
