name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each pull request merged with main and the ones queued ahead of
  # it; required checks must run here too, or the queue waits for them until it times out.
  merge_group:
    types: [checks_requested]

# A newer push to a pull request cancels its older run, whose result no one reads.
# Every other event (main, schedules, releases) gets a group of its own: never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trufflehog:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
        with:
          extra_args: --only-verified

  ci:
    name: Build, Test, Lint, Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Repair native optional bindings
        run: npm run deps:repair-native

      - name: Verify native bindings
        run: |
          node -e "require('@rolldown/binding-linux-x64-gnu')"
          node -e "require('@unrs/resolver-binding-linux-x64-gnu')"

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension
        run: npm run build:ext

      - name: Build webview
        run: npm run build:webview

      - name: Run tests (jest)
        run: npm run test:unit

      - name: Run semantic tests (jest)
        run: npm run test:semantic

      - name: Lint
        run: npm run lint

      - name: Check changes/ files
        run: npm run changelog:check

  # Most installs are on Windows, so run the tests there too. Lint, audit and
  # builds do not depend on the OS and stay in the job above.
  windows-tests:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run tests (jest)
        run: npm run test:unit

      - name: Run semantic tests (jest)
        run: npm run test:semantic
