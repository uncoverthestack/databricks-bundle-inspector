name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each pull request merged with main and the ones queued ahead of
  # it; required checks must run here too, or the queue waits for them until it times out.
  merge_group:
    types: [checks_requested]

# A newer push to a pull request cancels its older run, whose result no one reads.
# Every other event (main, schedules, releases) gets a group of its own: never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trufflehog:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc
        with:
          extra_args: --only-verified

  ci:
    name: Build, Test, Lint, Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Repair native optional bindings
        run: npm run deps:repair-native

      - name: Verify native bindings
        run: |
          node -e "require('@rolldown/binding-linux-x64-gnu')"
          node -e "require('@unrs/resolver-binding-linux-x64-gnu')"

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension
        run: npm run build:ext

      - name: Build webview
        run: npm run build:webview

      - name: Run tests (jest)
        run: npm run test:unit

      - name: Run semantic tests (jest)
        run: npm run test:semantic

      - name: Lint
        run: npm run lint

      - name: Check changes/ files
        run: npm run changelog:check

  # Most installs are on Windows, so run the tests there too. Lint, audit and
  # builds do not depend on the OS and stay in the job above.
  windows-tests:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run tests (jest)
        run: npm run test:unit

      - name: Run semantic tests (jest)
        run: npm run test:semantic

  # The command-line tool (#348) as users get it: packed, installed into an empty folder and
  # run on the oldest Node it supports, on each OS. The checks themselves are tested against
  # real Databricks CLIs in cli-compat.yml.
  cli-package:
    name: CLI package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional --ignore-scripts

      # The release's own pack step: one build under both npm names.
      - name: Build and pack the CLI
        run: |
          T="$(cd "$RUNNER_TEMP" && pwd)"
          npm run pack:cli -- --out "$T/packages"

      - name: Use the oldest supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install into an empty folder and run it
        run: |
          T="$(cd "$RUNNER_TEMP" && pwd)"
          W="$(pwd)"
          mkdir "$T/try" && cd "$T/try"
          npm init -y > /dev/null
          npm install --ignore-scripts "$T"/packages/uncoverthestack-databricks-bundle-inspector-*.tgz
          test "$(npx --no-install databricks-bundle-inspector --version)" = "$(node -p "require(process.argv[1]).version" "$W/cli/package.json")"
          npx --no-install databricks-bundle-inspector --help | grep -q "Usage: databricks-bundle-inspector check"
          # dabi is the same tool under a short command name.
          test "$(npx --no-install dabi --version)" = "$(npx --no-install databricks-bundle-inspector --version)"
          # No Databricks CLI at this path: a setup problem, exit code 3, with the reason.
          set +e
          npx --no-install databricks-bundle-inspector check "$W/src/test/fixtures/broken-job" --databricks-cli "$T/no-databricks" 2> err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" = 3
          grep -q "is not a working Databricks CLI" err.txt
          # The same tool under its plain name.
          mkdir "$T/try-plain" && cd "$T/try-plain"
          npm init -y > /dev/null
          npm install --ignore-scripts "$T"/packages/databricks-bundle-inspector-*.tgz
          test "$(npx --no-install databricks-bundle-inspector --version)" = "$(node -p "require(process.argv[1]).version" "$W/cli/package.json")"
