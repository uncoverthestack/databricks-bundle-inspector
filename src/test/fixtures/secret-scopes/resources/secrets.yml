resources:
  secret_scopes:
    app_scope:
      name: app-secrets
  jobs:
    secrets_job:
      name: secrets_job
      job_clusters:
        - job_cluster_key: c
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
            spark_env_vars:
              DB_PASSWORD: "{{secrets/env-scope/db_password}}"
            spark_conf:
              spark.hadoop.fs.azure.account.key: "{{secrets/conf-scope/storage_key}}"
      tasks:
        - task_key: defined_name
          job_cluster_key: c
          notebook_task: { notebook_path: ../src/defined_name.py }
        - task_key: by_key
          job_cluster_key: c
          notebook_task: { notebook_path: ../src/by_key.py }
        - task_key: external
          job_cluster_key: c
          notebook_task: { notebook_path: ../src/external.py }
        - task_key: dynamic
          job_cluster_key: c
          notebook_task: { notebook_path: ../src/dynamic.py }
        - task_key: commented
          job_cluster_key: c
          notebook_task: { notebook_path: ../src/commented.py }
        - task_key: sql
          sql_task:
            warehouse_id: abc
            file: { path: ../src/query.sql }
        - task_key: loop
          for_each_task:
            inputs: '["a"]'
            task:
              task_key: inner
              job_cluster_key: c
              notebook_task: { notebook_path: ../src/nested_item.py }
  pipelines:
    p:
      name: p
      catalog: main
      schema: s
      serverless: true
      libraries:
        - file: { path: ../src/dlt/bronze.py }
