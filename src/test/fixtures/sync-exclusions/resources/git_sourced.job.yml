resources:
  jobs:
    git_sourced:
      name: git_sourced
      git_source:
        git_url: https://github.com/example/repo
        git_provider: gitHub
        git_branch: main
      tasks:
        - task_key: from_git
          spark_python_task:
            python_file: ../src/ignored.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
