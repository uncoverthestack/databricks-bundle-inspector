resources:
  pipelines:
    ok_pipeline:
      name: ok_pipeline
      catalog: main
      schema: bronze
      serverless: true
      bogus_pipeline_field: true
      libraries:
        - notebook:
            path: ../src/dlt/bronze.py
        - glob:
            include: ../src/dlt/transforms/**
    broken_pipeline:
      name: broken_pipeline
      catalog: main
      schema: silver
      serverless: true
      libraries:
        - notebook:
            path: ../src/dlt/missing_notebook.py
        - file:
            path: ../src/dlt/missing_file.py
        - glob:
            include: ../src/dlt/empty/**
    workspace_pipeline:
      name: workspace_pipeline
      catalog: main
      schema: gold
      serverless: true
      libraries:
        - notebook:
            path: /Users/someone@example.com/pipelines/gold
    looped_pipeline:
      name: looped_pipeline
      serverless: true
      libraries:
        # A notebook listed as a file.
        - file:
            path: ../src/dlt/bronze.py
  jobs:
    refresh_job:
      name: refresh_job
      tasks:
        - task_key: refresh_broken
          pipeline_task:
            pipeline_id: ${resources.pipelines.broken_pipeline.id}
        - task_key: run_script
          depends_on:
            - task_key: refresh_broken
          spark_python_task:
            python_file: ../src/run.py
        - task_key: refresh_each
          depends_on:
            - task_key: refresh_broken
          for_each_task:
            inputs: "[1, 2]"
            task:
              task_key: refresh_each_inner
              pipeline_task:
                pipeline_id: ${resources.pipelines.looped_pipeline.id}
