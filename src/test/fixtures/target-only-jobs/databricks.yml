bundle: {name: dbi-tonly}
include: [resources/*.yml]
resources:
  jobs:
    shared:
      name: shared
      tasks: [{task_key: a, notebook_task: {notebook_path: ./nb.py}}]
targets:
  dev:
    default: true
    resources:
      jobs:
        shared:
          tasks: [{task_key: a, notebook_task: {notebook_path: ./nb.py}}]
        both:
          name: both
  prod:
    resources:
      jobs:
        nightly:
          name: nightly
          tasks: [{task_key: a, notebook_task: {notebook_path: ./nb.py}}]
