resources:
  pipelines:
    p1:
      name: p1
      libraries:
        - file:
            path: ../src/script.py
  jobs:
    other:
      name: other
      tasks:
        - task_key: nb
          notebook_task:
            notebook_path: ../src/nb.py
    all_tasks:
      name: all_tasks
      tasks:
        - task_key: t_notebook
          notebook_task:
            notebook_path: ../src/nb.py
        - task_key: t_clean_rooms
          clean_rooms_notebook_task:
            clean_room_name: cr1
            notebook_name: nb1
        - task_key: t_sql
          sql_task:
            warehouse_id: abc123
            file:
              path: ../src/q.sql
        - task_key: t_wheel
          python_wheel_task:
            package_name: my_pkg
            entry_point: main
        - task_key: t_jar
          spark_jar_task:
            main_class_name: com.example.Main
        - task_key: t_spark_python
          spark_python_task:
            python_file: ../src/script.py
        - task_key: t_spark_submit
          spark_submit_task:
            parameters: ["--class", "com.example.Main"]
        - task_key: t_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.p1.id}
        - task_key: t_run_job
          run_job_task:
            job_id: ${resources.jobs.other.id}
        - task_key: t_dbt
          dbt_task:
            commands: ["dbt run"]
            warehouse_id: abc123
        - task_key: t_dbt_platform
          dbt_platform_task:
            dbt_platform_job_id: "123"
            connection_resource_name: dbt_conn
        - task_key: t_dbt_cloud
          dbt_cloud_task:
            dbt_cloud_job_id: 456
            connection_resource_name: dbt_conn
        - task_key: t_condition
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"
        - task_key: t_for_each
          for_each_task:
            inputs: '["a","b"]'
            task:
              task_key: t_inner
              notebook_task:
                notebook_path: ../src/nb.py
        - task_key: t_dashboard
          dashboard_task:
            dashboard_id: dash123
            warehouse_id: abc123
        - task_key: t_power_bi
          power_bi_task:
            connection_resource_name: pbi_conn
            warehouse_id: abc123
        - task_key: t_alert
          alert_task:
            alert_id: alert123
            warehouse_id: abc123
        - task_key: t_ai_runtime
          ai_runtime_task:
            code_source_path: ../src/ai
            experiment: /Shared/exp
            deployments:
              - name: d1
        - task_key: t_gen_ai
          gen_ai_compute_task:
            dl_runtime_image: runtime-image:latest
            training_script_path: ../src/ai/train.py
        - task_key: t_python_operator
          python_operator_task:
            main: ../src/op.py
