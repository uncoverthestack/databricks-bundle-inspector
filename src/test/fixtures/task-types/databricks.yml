bundle:
  name: task_types

resources:
  jobs:
    j:
      name: task-types
      tasks:
        # A target swaps the type: reported on the target's line.
        - task_key: py_to_nb
          spark_python_task: { python_file: ./src/s.py }
          environment_key: e
        - task_key: nb_to_py
          notebook_task: { notebook_path: ./src/nb.py }
        # Two types written in one task, no target.
        - task_key: both_in_base
          notebook_task: { notebook_path: ./src/nb.py }
          spark_python_task: { python_file: ./src/s.py }
          environment_key: e
        # A for-each inner task with two types.
        - task_key: loop
          for_each_task:
            inputs: '["a", "b"]'
            task:
              task_key: loop_inner
              notebook_task: { notebook_path: ./src/nb.py }
              condition_task: { op: EQUAL_TO, left: "1", right: "1" }
        # Near misses: the target keeps the type.
        - task_key: same_type_new_path
          notebook_task: { notebook_path: ./src/nb.py }
        - task_key: other_setting
          notebook_task: { notebook_path: ./src/nb.py }
        - task_key: one_type
          notebook_task: { notebook_path: ./src/nb.py }
      environments:
        - environment_key: e
          spec: { environment_version: "4" }

targets:
  prod:
    default: true
    resources:
      jobs:
        j:
          tasks:
            - task_key: py_to_nb
              notebook_task: { notebook_path: ./src/nb.py }
            - task_key: nb_to_py
              spark_python_task: { python_file: ./src/s.py }
              environment_key: e
            - task_key: same_type_new_path
              notebook_task: { notebook_path: ./src/nb2.py }
            - task_key: other_setting
              timeout_seconds: 600
