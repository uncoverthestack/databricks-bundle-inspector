bundle:
  name: __NAME__
targets:
  probe:
    mode: development
    default: true
resources:
  jobs:
    probe:
      name: __NAME__
      tasks:
        - task_key: load
          notebook_task:
            notebook_path: ./nb.py
        - task_key: after
          depends_on:
            - task_key: load
              outcome: "true"
          notebook_task:
            notebook_path: ./nb.py
