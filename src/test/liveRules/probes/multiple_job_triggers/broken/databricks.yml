bundle:
  name: __NAME__
targets:
  probe:
    mode: development
    default: true
resources:
  jobs:
    probe:
      name: __NAME__
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      trigger:
        pause_status: PAUSED
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: t
          notebook_task:
            notebook_path: ./nb.py
